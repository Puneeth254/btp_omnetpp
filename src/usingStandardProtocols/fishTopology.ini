[General]
network = test_project.usingStandardProtocols.FishTopology



**.router1.numEthInterfaces = 2
**.router2.numEthInterfaces = 2
**.router3.numEthInterfaces = 4
**.centralRouter.numEthInterfaces = 4
**.client1.numEthInterfaces = 1
**.client2.numEthInterfaces = 1
**.server1.numEthInterfaces = 1
**.server2.numEthInterfaces = 1


#*.schedulerList = ${sch= "fifo", "random", "lifo", "rr", "sjf", "ljf"}
#*.schedulerList = ${sch= "random"}
#*.schedulerList = ${sch= "fifo"}
*.comparatorList = ${cmp= "fifoPacketComparator", "lifoPacketComparator", "shortestPacketComparator", "longestPacketComparator"}
*.queueCapacity = ${qc= 5000}
*.simTime = ${t= 50s}
*.sendInterval = ${interval= 1ms}

#repeat = 10

sim-time-limit = ${t}

**.router1.forwarding = true
**.router1.ipv4.typename = "inet.networklayer.ipv4.Ipv4NetworkLayer"
**.router1.ipv4.ip.typename = "test_project.usingStandardProtocols.CustomNetworkLayer"
**.router1.eth[*].queue.typename = "test_project.usingStandardProtocols.CustomQueue"
**.router1.eth[*].queue.packetCapacity = ${qc}
**.router1.eth[*].queue.dropperClass = "RandomPacketDropper"
**.router1.eth[*].queue.comparatorClass = ${cmp}
#**.router1.eth[*].queue.scheduler = ${sch}


**.centralRouter.forwarding = true
**.centralRouter.ipv4.typename = "inet.networklayer.ipv4.Ipv4NetworkLayer"
**.centralRouter.ipv4.ip.typename = "test_project.usingStandardProtocols.CustomNetworkLayer"
**.centralRouter.eth[*].queue.typename = "test_project.usingStandardProtocols.CustomQueue"
**.centralRouter.eth[*].queue.packetCapacity = ${qc}
**.centralRouter.eth[*].queue.dropperClass = "RandomPacketDropper"
**.centralRouter.eth[*].queue.comparatorClass = ${cmp}
#**.centralRouter.eth[*].queue.scheduler = ${sch}


**.router2.forwarding = true
**.router2.ipv4.typename = "inet.networklayer.ipv4.Ipv4NetworkLayer"
**.router2.ipv4.ip.typename = "test_project.usingStandardProtocols.CustomNetworkLayer"
**.router2.eth[*].queue.typename = "test_project.usingStandardProtocols.CustomQueue"
**.router2.eth[*].queue.packetCapacity = ${qc}
**.router2.eth[*].queue.dropperClass = "RandomPacketDropper"
**.router2.eth[*].queue.comparatorClass = ${cmp}
#**.router2.eth[*].queue.scheduler = ${sch}

**.router3.forwarding = true
**.router3.ipv4.typename = "inet.networklayer.ipv4.Ipv4NetworkLayer"
**.router3.ipv4.ip.typename = "test_project.usingStandardProtocols.CustomNetworkLayer"
**.router3.eth[*].queue.typename = "test_project.usingStandardProtocols.CustomQueue"
**.router3.eth[*].queue.packetCapacity = ${qc}
**.router3.eth[*].queue.dropperClass = "RandomPacketDropper"
**.router3.eth[*].queue.comparatorClass = ${cmp}
#**.router3.eth[*].queue.scheduler = ${sch}


**.client1.numApps = 1
**.client1.app[0].typename = "test_project.usingStandardProtocols.CustomUdpApp"
**.client1.app[0].destAddresses = "server1"
**.client1.app[0].destPort = 5000
**.client1.app[0].minMessageLength = 1024B
**.client1.app[0].maxMessageLength = 1024B
**.client1.app[0].messageLength = 1024B #Dummy
**.client1.app[0].startTime = 0s
#**.client1.app[0].stopTime = 1s
**.client1.app[0].sendInterval = ${interval}


**.client2.numApps = 1
**.client2.app[0].typename = "test_project.usingStandardProtocols.CustomUdpApp"
**.client2.app[0].destAddresses = "server2"
**.client2.app[0].destPort = 5000
**.client2.app[0].minMessageLength = 512B
**.client2.app[0].maxMessageLength = 512B
**.client2.app[0].messageLength = 1024B #Dummy
**.client2.app[0].startTime = 0s
#**.client2.app[0].stopTime = 1s
**.client2.app[0].sendInterval = ${interval}

**.server1.numApps = 1
**.server1.app[0].typename = "inet.applications.udpapp.UdpSink"
**.server1.app[0].localPort = 5000

**.server2.numApps = 1
**.server2.app[0].typename = "inet.applications.udpapp.UdpSink"
**.server2.app[0].localPort = 5000

**.vector-recording = true
**.scalar-recording = true
**.statistic-recording = true

**.configurator.addStaticRoutes = true
**.configurator.addDefaultRoutes = true
#**.configurator.config = xmldoc("config.xml")
#**.configurator.dumpConfig = "config_assigned.xml"






